<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레조넌스 - 관리자 패널</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header id="admin-header">
        <div class="header-container">
            <div class="logo">
                <h1>레조넌스 관리자 패널</h1>
            </div>
            <nav class="nav-menu">
                <ul>
                    <li><button id="logout-btn">로그아웃</button></li>
                    <li><button id="change-pw-btn">비밀번호 변경</button></li>
                    <li><button id="back-to-main-btn">메인으로</button></li>
                </ul>
            </nav>
            
            <!-- 비밀번호 변경 모달 추가 -->
            <div id="change-pw-modal" class="admin-modal">
                <div class="admin-modal-content">
                    <span class="close-admin-modal">&times;</span>
                    <h3>비밀번호 변경</h3>
                    <form id="change-pw-form">
                        <div class="input-group">
                            <label for="current-pw">현재 비밀번호</label>
                            <input type="password" id="current-pw" required>
                        </div>
                        <div class="input-group">
                            <label for="new-pw">새 비밀번호</label>
                            <input type="password" id="new-pw" required>
                        </div>
                        <div class="input-group">
                            <label for="confirm-pw">새 비밀번호 확인</label>
                            <input type="password" id="confirm-pw" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn">변경</button>
                        </div>
                        <p class="pw-change-error" id="pw-change-error"></p>
                    </form>
                </div>
            </div>
                </ul>
            </nav>
        </div>
    </header>

    <div class="admin-container">
        <aside class="admin-sidebar">
            <ul>
                <li><button class="admin-menu-btn active" data-panel="patch-notes-panel">패치노트 관리</button></li>
                <li><button class="admin-menu-btn" data-panel="character-panel">캐릭터 정보 관리</button></li>
                <li><button class="admin-menu-btn" data-panel="calculator-panel">강화 계산기 관리</button></li>
                <li><button class="admin-menu-btn" data-panel="new-feature-panel">새 기능 추가</button></li>
            </ul>
            <div class="admin-actions">
                <button id="save-data-btn" class="btn">저장</button>
                <button id="export-data-btn" class="btn secondary">데이터 내보내기</button>
                <button id="import-data-btn" class="btn secondary">데이터 가져오기</button>
                <input type="file" id="import-data-file" accept=".json" style="display: none;">
            </div>
        </aside>

        <main class="admin-main">
            <!-- 패치노트 관리 패널 -->
            <div id="patch-notes-panel" class="admin-panel active">
                <h2>패치노트 관리</h2>
                <div class="admin-panel-actions">
                    <button id="add-patch-btn" class="btn">새 패치노트 추가</button>
                </div>
                <div class="admin-patch-list" id="admin-patch-list">
                    <!-- 패치노트 목록이 여기에 로드됩니다 -->
                </div>
            </div>

            <!-- 캐릭터 정보 관리 패널 -->
            <div id="character-panel" class="admin-panel">
                <h2>캐릭터 정보 관리</h2>
                <div class="admin-panel-actions">
                    <button id="add-character-btn" class="btn">새 캐릭터 추가</button>
                </div>
                <div class="admin-character-list" id="admin-character-list">
                    <!-- 캐릭터 목록이 여기에 로드됩니다 -->
                </div>
            </div>

            <!-- 강화 계산기 관리 패널 -->
            <div id="calculator-panel" class="admin-panel">
                <h2>강화 계산기 관리</h2>
                <div class="admin-calculator-controls">
                    <div class="input-group">
                        <label for="calc-grade-select">등급 선택</label>
                        <select id="calc-grade-select">
                            <option value="UR">UR</option>
                            <option value="SSR">SSR</option>
                            <option value="SR">SR</option>
                            <option value="R">R</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="calc-type-select">유형 선택</label>
                        <select id="calc-type-select">
                            <option value="weapon">무기/방어구</option>
                            <option value="accessory">악세서리</option>
                        </select>
                    </div>
                    <button id="update-calc-data-btn" class="btn">데이터 업데이트</button>
                </div>
                <div class="admin-calculator-data" id="admin-calculator-data">
                    <!-- 강화 데이터 테이블이 여기에 로드됩니다 -->
                </div>
            </div>

            <!-- 새 기능 추가 패널 -->
            <div id="new-feature-panel" class="admin-panel">
                <h2>새 기능 추가</h2>
                <div class="admin-new-feature">
                    <div class="input-group">
                        <label for="new-feature-name">기능 이름</label>
                        <input type="text" id="new-feature-name" placeholder="예: 장비 도감">
                    </div>
                    <div class="input-group">
                        <label for="new-feature-desc">기능 설명</label>
                        <textarea id="new-feature-desc" rows="3" placeholder="기능에 대한 간단한 설명"></textarea>
                    </div>
                    <div class="input-group">
                        <label for="new-feature-icon">아이콘 (Font Awesome 클래스)</label>
                        <input type="text" id="new-feature-icon" placeholder="예: fa-book">
                    </div>
                    <button id="add-feature-btn" class="btn">기능 추가</button>
                </div>
            </div>
        </main>
    </div>

    <!-- 패치노트 편집 모달 -->
    <div id="patch-edit-modal" class="admin-modal">
        <div class="admin-modal-content">
            <span class="close-admin-modal">&times;</span>
            <h3>패치노트 편집</h3>
            <form id="patch-edit-form">
                <input type="hidden" id="edit-patch-id">
                <div class="input-group">
                    <label for="edit-patch-title">제목</label>
                    <input type="text" id="edit-patch-title" required>
                </div>
                <div class="input-group">
                    <label for="edit-patch-date">날짜</label>
                    <input type="date" id="edit-patch-date" required>
                </div>
                <div class="input-group">
                    <label for="edit-patch-type">유형</label>
                    <select id="edit-patch-type" required>
                        <option value="character">캐릭터 업데이트</option>
                        <option value="balance">밸런스 조정</option>
                        <option value="resource">리소스 패치</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="edit-patch-summary">요약</label>
                    <textarea id="edit-patch-summary" rows="2" required></textarea>
                </div>
                <div class="input-group">
                    <label for="edit-patch-details">상세 내용</label>
                    <textarea id="edit-patch-details" rows="10" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">저장</button>
                    <button type="button" id="delete-patch-btn" class="btn danger">삭제</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 캐릭터 편집 모달 -->
    <div id="character-edit-modal" class="admin-modal">
        <div class="admin-modal-content">
            <span class="close-admin-modal">&times;</span>
            <h3>캐릭터 정보 편집</h3>
            <form id="character-edit-form">
                <input type="hidden" id="edit-character-id">
                <div class="input-group">
                    <label for="edit-character-name">이름</label>
                    <input type="text" id="edit-character-name" required>
                </div>
                <div class="input-group">
                    <label for="edit-character-grade">등급</label>
                    <select id="edit-character-grade" required>
                        <option value="UR">UR</option>
                        <option value="SSR">SSR</option>
                        <option value="SR">SR</option>
                        <option value="R">R</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="edit-character-element">속성</label>
                    <select id="edit-character-element" required>
                        <option value="불">불</option>
                        <option value="물">물</option>
                        <option value="바람">바람</option>
                        <option value="땅">땅</option>
                        <option value="빛">빛</option>
                        <option value="어둠">어둠</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="edit-character-position">포지션</label>
                    <select id="edit-character-position" required>
                        <option value="딜러">딜러</option>
                        <option value="서포터">서포터</option>
                        <option value="탱커">탱커</option>
                        <option value="힐러">힐러</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="edit-character-thumbnail">썸네일 URL</label>
                    <input type="text" id="edit-character-thumbnail" required>
                </div>
                <div class="input-group">
                    <label for="edit-character-story">스토리</label>
                    <textarea id="edit-character-story" rows="3" required></textarea>
                </div>
                <div class="input-group">
                    <label for="edit-character-combat">전투 스타일</label>
                    <textarea id="edit-character-combat" rows="3" required></textarea>
                </div>
                <div class="input-group">
                    <label for="edit-character-equipment">추천 장비</label>
                    <textarea id="edit-character-equipment" rows="3" required></textarea>
                </div>
                <div class="input-group">
                    <label>스킬 정보</label>
                    <div id="character-skills-container">
                        <!-- 스킬 입력 필드가 여기에 추가됩니다 -->
                    </div>
                    <button type="button" id="add-skill-btn" class="btn secondary">스킬 추가</button>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">저장</button>
                    <button type="button" id="delete-character-btn" class="btn danger">삭제</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>
